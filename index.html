<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRSCPC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00ff00;
            --border-color: #333333;
            --error-color: #ff4d4d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .view { display: none; }
        .view.active { display: block; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        h2 { margin: 0; font-size: 1.05rem; color: #fff; }
        #user-info { font-size: 0.78rem; color: #888; }
		#user-info-menu { font-size: 0.78rem; color: #888; }
		
		#vinfo { font-size: 0.78rem; color: #888; }
        
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        label { display: block; font-size: 0.82rem; margin-bottom: 5px; color: #aaa; }
        button {
            width: 100%;
            padding: 11px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
            margin-bottom: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background: #333;
            border-color: var(--accent-color);
        }

        /* Botones del Menú Principal */
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            border-left: 4px solid var(--accent-color);
            padding: 14px 16px;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        .menu-btn span { font-size: 1.1rem; color: #888; }
        .menu-btn.futuro {
            border-left-color: #555;
            color: #888;
        }
        .btn-volver {
            background: #1a1a1a;
            border-color: #444;
            color: #ccc;
            margin-bottom: 10px;
        }

        /* Estilos del Buscador Desplegable Dinámico */
        .combobox-wrapper {
            position: relative;
            margin-bottom: 10px;
        }
        .combobox-input-box {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding-right: 6px;
        }
        .combobox-input-box:focus-within {
            border-color: var(--accent-color);
        }
        #input-buscar-remota {
            width: 100%;
            padding: 9px 10px;
            background: transparent;
            color: #fff;
            border: none;
            font-size: 0.88rem;
            outline: none;
            box-sizing: border-box;
        }
        #btn-limpiar-busqueda {
            width: auto;
            margin: 0;
            padding: 4px 8px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 0.9rem;
            cursor: pointer;
            display: none;
        }
        #btn-limpiar-busqueda:hover { color: #fff; }
        
        .dropdown-lista {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: 240px;
            overflow-y: auto;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            z-index: 1000;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
        }
        .dropdown-lista.open { display: block; }
        .dropdown-item {
            padding: 9px 12px;
            border-bottom: 1px solid #303030;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover, .dropdown-item.selected {
            background: #003300;
        }
        .item-nombre {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }
        .item-meta {
            font-size: 0.75rem;
            color: #00ff00;
            font-family: monospace;
            white-space: nowrap;
        }
        .dropdown-vacio {
            padding: 12px;
            text-align: center;
            color: #888;
            font-size: 0.82rem;
        }

        .nav-time {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .nav-time button {
            flex: 1;
            background: #004400;
            border-color: #00aa00;
            cursor: pointer;
            margin-bottom: 0;
            font-weight: 600;
        }
        .nav-time button:disabled {
            background: #252525;
            border-color: #333;
            color: #666;
            cursor: not-allowed;
        }
        .nav-time button:not(:disabled):active { background: #006600; }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            background: #000;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
            font-size: 0.82rem;
        }
        .metric-box {
            background: #252525;
            padding: 8px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
            transition: border-color 0.2s ease;
        }
        .metric-title { color: #888; font-size: 0.72rem; }
        .metric-value { font-weight: bold; color: #fff; margin-top: 2px; }
        .status-box {
            text-align: center;
            padding: 40px 15px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- VISTA 1: VERIFICACIÓN DE SEGURIDAD -->
    <div id="viewVerificando" class="view active">
        <div class="card status-box">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">🛰️</div>
            <h2 style="margin-bottom: 8px;">Verificando Credenciales</h2>
            <p id="txt-estado-auth" style="font-size: 0.85rem; color: #aaa;">
                🫆 Validando acceso...
            </p>
        </div>
    </div>

    <!-- VISTA 2: MENÚ PRINCIPAL -->
    <div id="viewMenu" class="view">
        <header>
            <div>
                <h2>🛰️ Monitoreo Remoto SCPC</h2>
                <div id="user-info-menu">Operador: --</div>
            </div>
            <div style="font-size: 0.75rem; color: #00ff00;">● En línea</div>
        </header>

        <div class="card" style="padding: 20px 15px;">
            <button class="menu-btn" onclick="mostrarVista('viewPrincipal')">
                📊 Histórico de Portadoras <span>&rsaquo;</span>
            </button>

            <button class="menu-btn" onclick="alert('En desarrollo')">
                📡 Monitoreo de Remotas <span>&rsaquo;</span>
            </button>

            <button class="menu-btn futuro" onclick="alert('En desarrollo')">
                🖥️ Analizador de Espectro <span>&rsaquo;</span>
            </button>
        </div>
		
		<div class="card" style="padding: 20px 15px;">
			<div id="vinfo">v1.1.5 - 20261118-0900</div>
		</div>
    </div>

    <!-- VISTA 3: INTERFAZ PRINCIPAL DEL ANALIZADOR / HISTÓRICO -->
    <div id="viewPrincipal" class="view">
        <header>
            <div>
                <h2>📊 Histórico de Portadoras</h2>
                <div id="user-info">Operador: --</div>
            </div>
            <button class="btn-volver" style="width: auto; margin: 0; padding: 6px 12px; font-size: 0.78rem;" onclick="mostrarVista('viewMenu')"><span>&lsaquo;</span> Menú</button>
        </header>

        <!-- Controles de Selección con Filtro Dinámico -->
        <div class="card">
            <label for="input-buscar-remota">Buscar Remota (Nombre, Transponder o MHz):</label>
            <div class="combobox-wrapper" id="combobox-remota">
                <div class="combobox-input-box">
                    <input type="text" id="input-buscar-remota" placeholder="Escriba para filtrar o toque para ver todas..." autocomplete="off">
                    <button type="button" id="btn-limpiar-busqueda" title="Limpiar filtro">✕</button>
                </div>
                <div class="dropdown-lista" id="lista-remotas-dropdown"></div>
            </div>

            <label>Navegación Histórica (<span id="lbl-contador">0/0</span>):</label>
            <div class="nav-time">
                <button id="btn-prev" disabled>◀ Anterior</button>
                <span id="lbl-timestamp" style="font-size: 0.78rem; text-align: center; flex: 1.4; font-family: monospace; color: #00ff00;">Sin traza</span>
                <button id="btn-next" disabled>Siguiente ▶</button>
            </div>
        </div>

        <!-- Panel de Gráfica Estilo FPH -->
        <div class="card">
            <div class="chart-container">
                <canvas id="spectrumChart"></canvas>
            </div>
            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-title">FRECUENCIA / BW</div>
                    <div class="metric-value" id="val-frec">-- MHz</div>
                </div>
                <div class="metric-box" style="border-left-color: #ff00ff;">
                    <div class="metric-title">TRANSPONDER</div>
                    <div class="metric-value" id="val-transponder">--</div>
                </div>
                <div class="metric-box" id="box-nivel-delta" style="border-left-color: #00ffff;">
                    <div class="metric-title">NIVEL / STATUS</div>
                    <div class="metric-value" id="val-delta">-- dB</div>
                </div>
                <div class="metric-box" style="border-left-color: #ff3333;">
                    <div class="metric-title">PISO TRANSPONDER</div>
                    <div class="metric-value" id="val-piso">-- dBm</div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const URL_WEBAPP = "https://script.google.com/macros/s/AKfycbxLuOURWX0-EjkTItoLh5upIPL0BVDwdZ6FWdX-BuvUzyluJNe9hficn6KK75m-8e0s/exec";
    const TAMANO_LOTE = 30;
    const MAX_ESTACIONES_CACHE = 10;
    
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.expand();
        tg.ready();
    }

    const paramsUrl = new URLSearchParams(window.location.search);
    let userId = paramsUrl.get("userId") || "";
    let userName = "Operador";

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        if (!userId && tg.initDataUnsafe.user.id) {
            userId = tg.initDataUnsafe.user.id.toString();
        }
        if (tg.initDataUnsafe.user.first_name) {
            userName = tg.initDataUnsafe.user.first_name;
        }
    }

    let listaPortadorasGlobal = [];
    let portadorasOrdenadasGlobal = [];
    let configAnalizadorGlobal = {};
    const cacheLRU = new Map();

    let portadoraSeleccionada = null;
    let indiceTrazaActual = -1;
    let cargandoLote = false;
    let chartInstance = null;

    function safeFloat(val, def = 0.0) {
        if (val === null || val === undefined || String(val).trim() === "") return def;
        const num = parseFloat(String(val).trim().replace(',', '.'));
        return isNaN(num) ? def : num;
    }

    function obtenerDesdeCache(portId) {
        if (!cacheLRU.has(portId)) return null;
        const entrada = cacheLRU.get(portId);
        cacheLRU.delete(portId);
        cacheLRU.set(portId, entrada);
        return entrada;
    }

    function guardarEnCache(portId, entrada) {
        if (cacheLRU.has(portId)) {
            cacheLRU.delete(portId);
        } else if (cacheLRU.size >= MAX_ESTACIONES_CACHE) {
            const claveMasAntigua = cacheLRU.keys().next().value;
            cacheLRU.delete(claveMasAntigua);
        }
        cacheLRU.set(portId, entrada);
    }

    function mostrarVista(idVista) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(idVista).classList.add('active');
        
        // Si volvemos a la vista principal del gráfico y hay instancia, forzar redibujado por si cambió el tamaño
        if (idVista === 'viewPrincipal' && chartInstance) {
            setTimeout(() => chartInstance.resize(), 50);
        }
    }

    function mostrarAccesoDenegado(motivo) {
        const box = document.querySelector('#viewVerificando .status-box');
        box.innerHTML = `
            <div style="font-size: 2.5rem; margin-bottom: 12px;">⛔</div>
            <h2 style="color: var(--error-color); margin-bottom: 8px;">Acceso Denegado</h2>
            <p style="font-size: 0.85rem; color: #aaa; line-height: 1.5;">
                ${motivo || "Tu ID de Telegram no está autorizado."}
            </p>
        `;
    }

    let labelHitBoxes = [];

    const fphOverlayPlugin = {
        id: 'fphOverlay',
        afterDatasetsDraw(chart) {
            if (!portadoraSeleccionada || indiceTrazaActual < 0) return;

            const { ctx, chartArea: { top, bottom, left, right }, scales: { y } } = chart;
            const frecCentro = safeFloat(portadoraSeleccionada.frecuencia);
            const bw = safeFloat(portadoraSeleccionada.bandwidth, 1.0);
            const span = safeFloat(configAnalizadorGlobal.FPH_SPAN_MHZ, 7.5);
            const polActiva = (portadoraSeleccionada.polarizacion || "").toUpperCase();

            const fMin = frecCentro - (span / 2.0);
            const fMax = frecCentro + (span / 2.0);

            const freqToPixelX = (freq) => {
                const ratio = (freq - fMin) / (fMax - fMin);
                return left + ratio * (right - left);
            };

            ctx.save();

            const xCentro = freqToPixelX(frecCentro);
            ctx.strokeStyle = '#0088FF';
            ctx.lineWidth = 1.3;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(xCentro, top);
            ctx.lineTo(xCentro, bottom);
            ctx.stroke();

            const xBwIzq = freqToPixelX(frecCentro - bw / 2.0);
            const xBwDer = freqToPixelX(frecCentro + bw / 2.0);
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 1;
            ctx.setLineDash([2, 3]);
            [xBwIzq, xBwDer].forEach(posX => {
                if (posX >= left && posX <= right) {
                    ctx.beginPath();
                    ctx.moveTo(posX, top);
                    ctx.lineTo(posX, bottom);
                    ctx.stroke();
                }
            });

            const pisoBase = obtenerPisoBase(portadoraSeleccionada.transponder);
            const yPiso = y.getPixelForValue(pisoBase);
            if (yPiso >= top && yPiso <= bottom) {
                ctx.strokeStyle = '#FF3333';
                ctx.lineWidth = 1.2;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(left, yPiso);
                ctx.lineTo(right, yPiso);
                ctx.stroke();
            }

            ctx.setLineDash([]);
            const datosTraza = chart.data.datasets[0].data;
            const vecinas = listaPortadorasGlobal.filter(p => {
                const f = safeFloat(p.frecuencia);
                const pol = (p.polarizacion || "").toUpperCase();
                return pol === polActiva && f >= fMin && f <= fMax;
            });

            labelHitBoxes = [];

            vecinas.forEach(v => {
                const fVec = safeFloat(v.frecuencia);
                const xVec = freqToPixelX(fVec);
                const idxPunto = Math.min(710, Math.max(0, Math.round(((fVec - fMin) / span) * 710)));
                const ampPunto = datosTraza[idxPunto] || -100;
                let yTexto = y.getPixelForValue(ampPunto) - 8;
                if (yTexto < top + 45) yTexto = top + 45;

                const esPrincipal = String(v.id) === String(portadoraSeleccionada.id);
                
                ctx.font = esPrincipal ? 'bold 10px sans-serif' : '9px sans-serif';
                const textWidth = ctx.measureText(v.estacion).width;

                labelHitBoxes.push({
                    xMin: xVec - 8,
                    xMax: xVec + 10,
                    yMin: yTexto - textWidth - 4,
                    yMax: yTexto + 4,
                    portadora: v
                });

                ctx.save();
                ctx.translate(xVec, yTexto);
                ctx.rotate(-Math.PI / 2);
                ctx.fillStyle = esPrincipal ? '#FFFF00' : '#B0B0B0';
                ctx.textAlign = 'left';
                ctx.fillText(v.estacion, 0, 3);
                ctx.restore();
            });

            ctx.restore();
        }
    };

    function obtenerPisoBase(transponder) {
        if (!transponder) return -90.0;
        const transNorm = String(transponder).replace(/\s+/g, '').replace(/\//g, '').toUpperCase();
        const clave = `FPH_PISO_RUIDO_${transNorm}`;
        return safeFloat(configAnalizadorGlobal[clave], -90.0);
    }

    function calcularMetricasPortadora(puntos, portadora) {
        const bwTeorico = safeFloat(portadora.bandwidth, 1.0);
        const spanOperacion = safeFloat(configAnalizadorGlobal.FPH_SPAN_MHZ, 7.5);
        const fphMinLev = safeFloat(configAnalizadorGlobal.FPH_MIN_LEV, 4.0);
        const fphUmbralRipple = safeFloat(configAnalizadorGlobal.FPH_UMBRAL_RIPPLE, 4.0);

        const hzPerPoint = spanOperacion / 710.0;
        const idxCentroTeorico = 355;
        const pisoRuido = obtenerPisoBase(portadora.transponder);

        const pTeorica = puntos[idxCentroTeorico] !== undefined ? puntos[idxCentroTeorico] : -100.0;
        const deltaPresencia = pTeorica - pisoRuido;

        const k60 = Math.round(((bwTeorico * 0.6) / 2.0) / hzPerPoint);

        if (deltaPresencia < fphMinLev) {
            const idxStart = Math.max(0, idxCentroTeorico - k60);
            const idxEnd = Math.min(710, idxCentroTeorico + k60);
            const segmento = puntos.slice(idxStart, idxEnd + 1);
            const promedio = segmento.reduce((acc, v) => acc + v, 0) / segmento.length;
            return {
                promedioDbm: promedio,
                estado: "CAIDA",
                textoDetalle: "🔴 No detectada"
            };
        }

        const halfBwPoints = Math.round((bwTeorico / 2.0) / hzPerPoint);
        const wStart = Math.max(0, idxCentroTeorico - halfBwPoints);
        const wEnd = Math.min(710, idxCentroTeorico + halfBwPoints);

        const smoothed = [...puntos];
        for (let sIdx = 1; sIdx < 710; sIdx++) {
            smoothed[sIdx] = (puntos[sIdx - 1] + puntos[sIdx] + puntos[sIdx + 1]) / 3.0;
        }

        let num = 0.0;
        let den = 0.0;
        for (let idx = wStart; idx <= wEnd; idx++) {
            const pLin = Math.pow(10.0, smoothed[idx] / 10.0);
            num += idx * pLin;
            den += pLin;
        }

        let idxCentroReal = den > 0 ? Math.round(num / den) : idxCentroTeorico;
        idxCentroReal = Math.max(wStart, Math.min(wEnd, idxCentroReal));

        const idxStart = Math.max(0, idxCentroReal - k60);
        const idxEnd = Math.min(710, idxCentroReal + k60);
        const segmento = puntos.slice(idxStart, idxEnd + 1);

        const potenciaPromedioDbm = segmento.reduce((acc, v) => acc + v, 0) / segmento.length;
        const deltaDb = Math.abs(potenciaPromedioDbm - pisoRuido);
        const rippleDetectado = Math.max(...segmento) - Math.min(...segmento);

        if (rippleDetectado > fphUmbralRipple) {
            return {
                promedioDbm: potenciaPromedioDbm,
                estado: "RIPPLE",
                textoDetalle: `⚠️ Deformada (R: ${rippleDetectado.toFixed(2)} dB)`
            };
        }

        return {
            promedioDbm: potenciaPromedioDbm,
            estado: "OK",
            textoDetalle: `Δ ${deltaDb.toFixed(2)} dB`
        };
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (!userId) {
            mostrarAccesoDenegado("No se detectó una sesión válida de Telegram.");
            return;
        }

        fetch(`${URL_WEBAPP}?operacion=init_miniapp&userId=${encodeURIComponent(userId)}`)
            .then(res => {
                if (!res.ok) throw new Error("Error HTTP " + res.status);
                return res.json();
            })
            .then(data => {
                if (!data.status || data.autorizado === false) {
                    mostrarAccesoDenegado("No posees privilegios para acceder al monitoreo espectral.");
                    return;
                }

                listaPortadorasGlobal = data.portadoras || [];
                configAnalizadorGlobal = data.config || {};

                portadorasOrdenadasGlobal = [...listaPortadorasGlobal].sort((a, b) => {
                    const tpA = String(a.transponder || "").trim();
                    const tpB = String(b.transponder || "").trim();
                    const compTp = tpA.localeCompare(tpB, undefined, { numeric: true, sensitivity: 'base' });
                    if (compTp !== 0) return compTp;
                    return safeFloat(a.frecuencia) - safeFloat(b.frecuencia);
                });

                document.getElementById('user-info').innerText = `Operador: ${userName}`;
                document.getElementById('user-info-menu').innerText = `Operador: ${userName}`;
                
                inicializarBuscadorRemotas();
                initChart();
                mostrarVista('viewMenu'); // 👈 Iniciamos mostrando el Menú Principal
            })
            .catch(err => {
                mostrarAccesoDenegado("Error de conexión: " + err.message);
            });
    });

    function inicializarBuscadorRemotas() {
        const inputBuscar = document.getElementById('input-buscar-remota');
        const btnLimpiar = document.getElementById('btn-limpiar-busqueda');
        const dropdown = document.getElementById('lista-remotas-dropdown');
        const wrapper = document.getElementById('combobox-remota');

        inputBuscar.placeholder = `Buscar entre ${portadorasOrdenadasGlobal.length} portadoras...`;

        const renderizarOpciones = (filtroTexto = "") => {
            const termino = filtroTexto.trim().toLowerCase();
            dropdown.innerHTML = "";

            const filtradas = portadorasOrdenadasGlobal.filter(p => {
                if (!termino) return true;
                const nombre = String(p.estacion || "").toLowerCase();
                const tp = String(p.transponder || "").toLowerCase();
                const frec = String(p.frecuencia || "").toLowerCase();
                return nombre.includes(termino) || tp.includes(termino) || frec.includes(termino);
            });

            if (filtradas.length === 0) {
                dropdown.innerHTML = '<div class="dropdown-vacio">No se encontraron portadoras coincidentes</div>';
                return;
            }

            filtradas.forEach(p => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                if (portadoraSeleccionada && String(portadoraSeleccionada.id) === String(p.id)) {
                    div.classList.add('selected');
                }

                div.innerHTML = `
                    <span class="item-nombre">${p.estacion}</span>
                    <span class="item-meta">[${p.transponder}] ${p.frecuencia} MHz</span>
                `;

                div.addEventListener('click', () => {
                    elegirPortadora(p);
                    dropdown.classList.remove('open');
                });

                dropdown.appendChild(div);
            });
        };

        const elegirPortadora = (portadora) => {
            portadoraSeleccionada = portadora;
            const idSel = String(portadora.id);
            inputBuscar.value = `${portadora.estacion} [${portadora.transponder}] - ${portadora.frecuencia} MHz`;
            btnLimpiar.style.display = 'block';

            document.getElementById('val-frec').innerText = `${portadora.frecuencia} MHz / ${portadora.bandwidth} MHz`;
            document.getElementById('val-transponder').innerText = `${portadora.transponder}`;
            document.getElementById('val-piso').innerText = `${obtenerPisoBase(portadora.transponder).toFixed(1)} dBm`;

            seleccionarPortadora(idSel);
        };

        inputBuscar.addEventListener('focus', () => {
            inputBuscar.select();
            renderizarOpciones("");
            dropdown.classList.add('open');
        });

        inputBuscar.addEventListener('input', () => {
            const val = inputBuscar.value;
            btnLimpiar.style.display = val.length > 0 ? 'block' : 'none';
            renderizarOpciones(val);
            dropdown.classList.add('open');
        });

        btnLimpiar.addEventListener('click', () => {
            inputBuscar.value = "";
            btnLimpiar.style.display = 'none';
            renderizarOpciones("");
            dropdown.classList.add('open');
            inputBuscar.focus();
        });

        document.addEventListener('click', (e) => {
            if (!wrapper.contains(e.target)) {
                dropdown.classList.remove('open');
                if (portadoraSeleccionada) {
                    inputBuscar.value = `${portadoraSeleccionada.estacion} [${portadoraSeleccionada.transponder}] - ${portadoraSeleccionada.frecuencia} MHz`;
                    btnLimpiar.style.display = 'block';
                }
            }
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            if (!portadoraSeleccionada || cargandoLote) return;
            const portId = String(portadoraSeleccionada.id);
            const cache = obtenerDesdeCache(portId);
            if (!cache) return;

            if (indiceTrazaActual > 0) {
                indiceTrazaActual--;
                renderizarTrazaActual();
            } else if (cache.hayMas) {
                solicitarLoteTrazas(portId, cache.items.length, true);
            }
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            if (!portadoraSeleccionada || cargandoLote) return;
            const portId = String(portadoraSeleccionada.id);
            const cache = obtenerDesdeCache(portId);
            if (!cache) return;

            if (indiceTrazaActual < cache.items.length - 1) {
                indiceTrazaActual++;
                renderizarTrazaActual();
            }
        });
    }

    function seleccionarPortadora(portId) {
        const cache = obtenerDesdeCache(portId);
        if (cache) {
            indiceTrazaActual = cache.items.length - 1;
            renderizarTrazaActual();
            return;
        }
        solicitarLoteTrazas(portId, 0, false);
    }

    function solicitarLoteTrazas(portId, offset, esPaginacionHaciaAtras) {
        cargandoLote = true;
        const lblTs = document.getElementById('lbl-timestamp');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        lblTs.innerText = esPaginacionHaciaAtras ? "Cargando más..." : "Descargando...";
        btnPrev.disabled = true;
        btnNext.disabled = true;

        const url = `${URL_WEBAPP}?operacion=obtener_trazas_portadora&userId=${encodeURIComponent(userId)}&portadoraId=${encodeURIComponent(portId)}&offset=${offset}&limit=${TAMANO_LOTE}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                cargandoLote = false;
                if (!data.status || !Array.isArray(data.trazas)) {
                    lblTs.innerText = data.error ? `Err: ${data.error}` : "Error cargando";
                    return;
                }

                const nuevosItems = data.trazas.map(item => ({
                    timestamp: item.timestamp,
                    trazaBase64: item.traza,
                    puntos: null
                }));

                const cacheExistente = obtenerDesdeCache(portId);
                if (esPaginacionHaciaAtras && cacheExistente) {
                    const cantidadAgregada = nuevosItems.length;
                    const combinados = [...nuevosItems, ...cacheExistente.items];
                    guardarEnCache(portId, {
                        items: combinados,
                        hayMas: Boolean(data.hayMas),
                        totalDisponibles: data.totalDisponibles || combinados.length
                    });
                    indiceTrazaActual = Math.max(0, cantidadAgregada - 1);
                } else {
                    guardarEnCache(portId, {
                        items: nuevosItems,
                        hayMas: Boolean(data.hayMas),
                        totalDisponibles: data.totalDisponibles || nuevosItems.length
                    });
                    indiceTrazaActual = nuevosItems.length - 1;
                }

                if (portadoraSeleccionada && String(portadoraSeleccionada.id) === portId) {
                    renderizarTrazaActual();
                }
            })
            .catch(err => {
                cargandoLote = false;
                console.error(err);
                lblTs.innerText = "Error de red";
            });
    }

    function descomprimirTraza(base64Str) {
        try {
            const binString = atob(base64Str);
            const bytes = new Uint8Array(binString.length);
            for (let i = 0; i < binString.length; i++) {
                bytes[i] = binString.charCodeAt(i);
            }
            const decompressedData = pako.inflate(bytes, { to: 'string' });
            const puntosEnteros = decompressedData.split(',').map(Number);
            return puntosEnteros.map(val => -val / 100.0);
        } catch (error) {
            console.error("Error descomprimiendo traza:", error);
            return Array(711).fill(-110);
        }
    }

    function renderizarTrazaActual() {
        if (!portadoraSeleccionada) return;
        const portId = String(portadoraSeleccionada.id);
        const cache = obtenerDesdeCache(portId);

        actualizarControlesTiempo(cache);
        if (!cache || indiceTrazaActual < 0 || !cache.items[indiceTrazaActual]) return;

        const registro = cache.items[indiceTrazaActual];

        if (!registro.puntos) {
            registro.puntos = descomprimirTraza(registro.trazaBase64);
        }
        const puntos = registro.puntos;

        const metricas = calcularMetricasPortadora(puntos, portadoraSeleccionada);
        const boxDelta = document.getElementById('box-nivel-delta');
        const valDelta = document.getElementById('val-delta');

        valDelta.innerText = `${metricas.promedioDbm.toFixed(2)} dBm (${metricas.textoDetalle})`;

        if (metricas.estado === "CAIDA") {
            boxDelta.style.borderLeftColor = "#ff4d4d";
            valDelta.style.color = "#ff8a8a";
        } else if (metricas.estado === "RIPPLE") {
            boxDelta.style.borderLeftColor = "#ffaa00";
            valDelta.style.color = "#ffd166";
        } else {
            boxDelta.style.borderLeftColor = "#00ffff";
            valDelta.style.color = "#ffffff";
        }

        const frecCentro = safeFloat(portadoraSeleccionada.frecuencia);
        const span = safeFloat(configAnalizadorGlobal.FPH_SPAN_MHZ, 7.5);
        const fMin = frecCentro - (span / 2.0);
        const paso = span / 710.0;
        const labelsMhz = Array.from({length: 711}, (_, i) => (fMin + i * paso).toFixed(2));

        chartInstance.data.labels = labelsMhz;
        chartInstance.data.datasets[0].data = puntos;
        chartInstance.update();
    }

    function actualizarControlesTiempo(cache) {
        const lblTs = document.getElementById('lbl-timestamp');
        const lblCont = document.getElementById('lbl-contador');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        if (!cache || cache.items.length === 0 || indiceTrazaActual < 0) {
            lblTs.innerText = "Sin trazas guardadas";
            lblCont.innerText = "0/0";
            btnPrev.disabled = true;
            btnNext.disabled = true;
            return;
        }

        const cargadas = cache.items.length;
        const total = cache.totalDisponibles || cargadas;
        const posGlobal = (total - cargadas) + indiceTrazaActual + 1;

        lblTs.innerText = cache.items[indiceTrazaActual].timestamp;
        lblCont.innerText = `${posGlobal}/${total}`;

        btnPrev.disabled = (indiceTrazaActual <= 0 && !cache.hayMas);
        btnNext.disabled = (indiceTrazaActual >= cargadas - 1);
    }

    function initChart() {
        const ctx = document.getElementById('spectrumChart').getContext('2d');
        const refLevel = safeFloat(configAnalizadorGlobal.FPH_REF_LEVEL_DBM, -50);
        const ampRes = safeFloat(configAnalizadorGlobal.FPH_AMP_RES, 50);

        const canvas = document.getElementById('spectrumChart');

        canvas.addEventListener('click', (e) => {
            const clickX = e.offsetX;
            const clickY = e.offsetY;

            for (let box of labelHitBoxes) {
                if (clickX >= box.xMin && clickX <= box.xMax && clickY >= box.yMin && clickY <= box.yMax) {
                    const portadoraEncontrada = box.portadora;
                    
                    const inputBuscar = document.getElementById('input-buscar-remota');
                    const btnLimpiar = document.getElementById('btn-limpiar-busqueda');
                    inputBuscar.value = `${portadoraEncontrada.estacion} [${portadoraEncontrada.transponder}] - ${portadoraEncontrada.frecuencia} MHz`;
                    btnLimpiar.style.display = 'block';

                    portadoraSeleccionada = portadoraEncontrada;
                    document.getElementById('val-frec').innerText = `${portadoraEncontrada.frecuencia} MHz / ${portadoraEncontrada.bandwidth} MHz`;
                    document.getElementById('val-transponder').innerText = `${portadoraEncontrada.transponder}`;
                    document.getElementById('val-piso').innerText = `${obtenerPisoBase(portadoraEncontrada.transponder).toFixed(1)} dBm`;

                    seleccionarPortadora(String(portadoraEncontrada.id));
                    break;
                }
            }
        });

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: 711}, (_, i) => i),
                datasets: [{
                    label: 'Traza Espectral',
                    data: Array(711).fill(refLevel - ampRes),
                    borderColor: '#00FF00',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false
                }]
            },
            plugins: [fphOverlayPlugin],
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: {
                        grid: { color: '#262626' },
                        ticks: {
                            color: '#888',
                            font: { size: 9 },
                            maxTicksLimit: 11
                        }
                    },
                    y: {
                        min: refLevel - ampRes,
                        max: refLevel,
                        grid: { color: '#262626' },
                        ticks: {
                            color: '#888',
                            font: { size: 9 },
                            stepSize: ampRes / 10
                        }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
</script>
